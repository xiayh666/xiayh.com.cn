<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xiayh 的个人网站：记录文章、项目、技术探索与个人动态。" />
    <title>Xiayh 的个人网站</title>
    <style>
      @font-face {
        font-family: "AudioLink Mono";
        src: url("/fonts/AudioLinkMono-Regular.ttf?v=20260715c") format("truetype");
        font-weight: 300 699;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "AudioLink Mono";
        src: url("/fonts/AudioLinkMono-Bold.ttf?v=20260715c") format("truetype");
        font-weight: 700 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --boot-surface: hsl(220 23% 95%);
        --boot-panel: hsl(220 22% 92%);
        --boot-ink: hsl(234 16% 35%);
        --boot-muted: hsl(233 10% 47%);
        --boot-line: hsl(225 14% 77%);
        --boot-accent: hsl(266 85% 58%);
        --boot-font: "AudioLink Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .boot-loader {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--boot-surface);
        color: var(--boot-ink);
        font-family: var(--boot-font);
        opacity: 0;
        pointer-events: none;
        transition: opacity 260ms ease, visibility 260ms ease;
        visibility: hidden;
      }

      .boot-loader__panel {
        width: min(18rem, calc(100vw - 2rem));
        border: 1px solid var(--boot-ink);
        background: var(--boot-panel);
        box-shadow: 0 0.55rem 0 var(--boot-line);
      }

      .boot-loader__label {
        display: flex;
        height: 1.85rem;
        align-items: center;
        border-bottom: 1px solid var(--boot-ink);
        padding: 0 0.65rem;
        background: var(--boot-ink);
        color: var(--boot-surface);
        font-family: var(--boot-font);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .boot-loader__body {
        display: grid;
        gap: 0.7rem;
        padding: 0.85rem;
        color: var(--boot-ink);
        font-family: var(--boot-font);
      }

      .boot-loader__text {
        font-size: 0.82rem;
        font-weight: 760;
        letter-spacing: 0.06em;
        line-height: 1.2;
        text-transform: lowercase;
      }

      .boot-loader__bar {
        position: relative;
        height: 0.42rem;
        border: 1px solid var(--boot-line);
        overflow: hidden;
        background: var(--boot-surface);
      }

      .boot-loader__bar::before {
        position: absolute;
        inset: 0;
        width: 38%;
        background: var(--boot-accent);
        content: "";
        animation: boot-loader-scan 980ms cubic-bezier(0.55, 0, 0.25, 1) infinite;
      }

      .boot-loader-visible .boot-loader {
        opacity: 1;
        pointer-events: auto;
        visibility: visible;
      }

      .app-ready .boot-loader {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      @keyframes boot-loader-scan {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(265%);
        }
      }

      @media (max-width: 620px) {
        .boot-loader {
          padding: 1rem;
        }

        .boot-loader__panel {
          width: min(18rem, 100%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader,
        .boot-loader__bar::before {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot-loader" id="boot-loader" role="status" aria-live="polite">
      <section class="boot-loader__panel" aria-label="网站加载中">
        <span class="boot-loader__label">window</span>
        <div class="boot-loader__body">
          <span class="boot-loader__text">loading...</span>
          <div class="boot-loader__bar" aria-hidden="true"></div>
        </div>
      </section>
    </div>
    <script>
      (() => {
        const state = {
          fadeMs: 260,
          minVisibleMs: 500,
          readyClass: "app-ready",
          showDelayMs: 350,
          shownAt: 0,
          visibleClass: "boot-loader-visible",
        };

        state.showTimer = window.setTimeout(() => {
          state.shownAt = performance.now();
          document.documentElement.classList.add(state.visibleClass);
        }, state.showDelayMs);

        window.__bootLoader = state;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
