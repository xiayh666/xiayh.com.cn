# Local, non-root smoke-test configuration.
# Start with: nginx -c "$PWD/deploy/nginx.local.conf" -p "$PWD"
pid /tmp/xiayh-personal-site-nginx.pid;
lock_file /tmp/xiayh-personal-site-nginx.lock;
error_log /tmp/xiayh-personal-site-nginx-error.log;

events {}

http {
    include /etc/nginx/mime.types;
    types_hash_max_size 2048;
    types_hash_bucket_size 128;
    access_log /tmp/xiayh-personal-site-nginx-access.log;

    # Run nginx as a normal user: keep every writable path out of /var/lib/nginx.
    client_body_temp_path /tmp/xiayh-personal-site-nginx-client-body;
    proxy_temp_path /tmp/xiayh-personal-site-nginx-proxy;
    fastcgi_temp_path /tmp/xiayh-personal-site-nginx-fastcgi;
    uwsgi_temp_path /tmp/xiayh-personal-site-nginx-uwsgi;
    scgi_temp_path /tmp/xiayh-personal-site-nginx-scgi;

    server {
        listen 127.0.0.1:8081;
        server_name localhost;

        root /home/xiayh/xiayh.com.cn/frontend/dist;
        index index.html;
        client_max_body_size 6m;

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
