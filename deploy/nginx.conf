# Install as /etc/nginx/sites-available/xiayh-personal-site and enable it
# from /etc/nginx/sites-enabled/. Certbot can extend this server block with TLS.
server {
    listen 80;
    listen [::]:80;
    server_name xiayh.com.cn www.xiayh.com.cn;

    root /opt/xiayh-personal-site/frontend;
    index index.html;

    # Keep this slightly above IMAGE_UPLOAD_LIMIT in deploy/blog.env.
    client_max_body_size 6m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed assets, so they can be cached permanently.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not expose hidden files if one is accidentally copied into the web root.
    location ~ /\. {
        deny all;
        return 404;
    }

    # React Router routes fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
