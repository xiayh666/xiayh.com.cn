services:
  api:
    build:
      context: .
      dockerfile: backend/fastify/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /data/blog.sqlite3
      NOTES_REPO: /data/notes
      MEDIA_ROOT: /data/media
      TRUST_PROXY: "true"
    volumes:
      - ./data:/data
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"
